@for (product of PRODUCTS; track $index) {
<div class="product-card" [class.out-of-stock]="product.stock === 0" 
[appLowStock]="product.stock">
  
  @defer (on viewport) {
    <img [src]="product.imageUrl" [alt]="product.name" />
  }@placeholder {
  <div class="image-placeholder"></div>
}
  <h2>{{ product.name | titlecase}}</h2>
  <p>{{ product.category }}</p>
  <p>{{ product.price | currency: 'EUR' }}</p>
  <p >{{ product.stock | stockLabel }}</p>
  <div>
    <button [disabled]="product.stock === 0" (click)="countClick()">
      Ajouter au panier ({{ count() }})
    </button>
  </div>
  
</div>}
